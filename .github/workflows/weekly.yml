name: Sunday Edge run

# Primary clock: a Claude scheduled task pushes requests/run (containing the mode), which starts this
# workflow immediately. The cron entries are late backups: with --backup they skip the odds pull entirely
# if the primary run already pulled in the last 12 hours, so they never spend credits twice.
#   grade    Tuesday     grade last week, refresh data and projections (no odds credits)
#   thu      Thursday    props for Thursday's game + game lines            (~7 credits)
#   week     Saturday    props for every remaining game this week + lines (~55 credits)
#   sun      Sunday      only games whose props are missing or 18h+ old   (~3-10 credits)
#   rescore  any time    re-run with updated injuries/inactives using pulled lines (no credits)
#   game:N   any time    props for games starting in the next N hours
on:
  schedule:
    - cron: '17 12 * * 2'   # Tue ~7:17 AM Central (backup)
    - cron: '47 12 * * 4'   # Thu ~7:47 AM Central (backup)
    - cron: '47 1 * * 0'    # Sat ~8:47 PM Central (backup)
    - cron: '7 16 * * 0'    # Sun ~11:07 AM Central (backup)
  workflow_dispatch:
    inputs:
      mode:
        description: 'grade, thu, week, sun, rescore, or game:N'
        default: 'rescore'
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/**', 'requirements.txt', 'requests/**']

permissions:
  contents: write

concurrency:
  group: sunday-edge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore nflverse data cache
        uses: actions/cache@v4
        with:
          path: data/*.parquet
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Decide mode
        id: mode
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "schedule:17 12 * * 2") MODE=grade ;;
            "schedule:47 12 * * 4") MODE=thu; BACKUP=--backup ;;
            "schedule:47 1 * * 0")  MODE=week; BACKUP=--backup ;;
            "schedule:7 16 * * 0")  MODE=rescore ;;
            "workflow_dispatch:"*)  MODE="${{ github.event.inputs.mode }}" ;;
            *) if [ -f requests/run ]; then MODE=$(tr -d '[:space:]' < requests/run); else MODE=code; fi ;;
          esac
          case "$MODE" in
            thu)     ARGS="--props-hours 20 $BACKUP" ;;
            sun)     ARGS="--props-week" ;;
            week)    ARGS="--props-week $BACKUP" ;;
            game:*)  ARGS="--props-hours ${MODE#game:}" ;;
            *)       ARGS="skip" ;;
          esac
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "Mode: $MODE  Odds: $ARGS"

      - name: Pull Underdog and sportsbook odds
        if: steps.mode.outputs.args != 'skip'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline/fetch_odds.py ${{ steps.mode.outputs.args }}

      - name: Download nflverse data and injury feeds
        run: python pipeline/download_data.py

      - name: Run models and build dashboard
        run: python pipeline/run.py

      - name: Commit results
        run: |
          git config user.name "sunday-edge-bot"
          git config user.email "sunday-edge-bot@users.noreply.github.com"
          rm -f requests/run requests/props requests/probe
          git add -A data site
          git add -A requests 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update (${{ steps.mode.outputs.mode }}) $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X ours origin main && git push origin HEAD:main
