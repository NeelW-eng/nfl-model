name: Sunday Edge weekly run

# Times are UTC. 11:00 UTC = 6:00 AM Central (5:00 AM after daylight saving ends).
on:
  schedule:
    - cron: '0 11 * * 2'   # Tuesday:  grade last week, refresh projections (no odds credits)
    - cron: '0 11 * * 4'   # Thursday: game lines + props for Thursday night
    - cron: '0 11 * * 0'   # Sunday:   game lines + props for Sunday and Monday games
  workflow_dispatch:
    inputs:
      odds:
        description: 'Odds pull: none, games, or full'
        default: 'games'
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/**', 'requirements.txt', 'requests/**']

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore nflverse data cache
        uses: actions/cache@v4
        with:
          path: data/*.parquet
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Decide odds pull
        id: mode
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "schedule:0 11 * * 2") echo "args=skip" >> $GITHUB_OUTPUT ;;
            "schedule:0 11 * * 4") echo "args=--props-hours 20" >> $GITHUB_OUTPUT ;;
            "schedule:0 11 * * 0") echo "args=--props-hours 40" >> $GITHUB_OUTPUT ;;
            "workflow_dispatch:"*)
              case "${{ github.event.inputs.odds }}" in
                none) echo "args=skip" >> $GITHUB_OUTPUT ;;
                full) echo "args=--props-hours 170" >> $GITHUB_OUTPUT ;;
                *)    echo "args=--no-props" >> $GITHUB_OUTPUT ;;
              esac ;;
            *)
              # a pushed requests/props file (containing N) asks for props for games in the next N hours
              if [ -f requests/props ]; then echo "args=--props-hours $(tr -dc '0-9' < requests/props)" >> $GITHUB_OUTPUT;
              else echo "args=--no-props" >> $GITHUB_OUTPUT; fi ;;
          esac

      - name: Pull FanDuel and market odds
        if: steps.mode.outputs.args != 'skip'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline/fetch_odds.py ${{ steps.mode.outputs.args }}

      - name: Download nflverse data (PFR, Next Gen Stats, FTN, play-by-play)
        run: python pipeline/download_data.py

      - name: Run models and build dashboard
        run: python pipeline/run.py

      - name: Commit results
        run: |
          git config user.name "sunday-edge-bot"
          git config user.email "sunday-edge-bot@users.noreply.github.com"
          rm -f requests/props
          git add -A data site requests
          git diff --cached --quiet || git commit -m "Weekly update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main && git push origin HEAD:main
